<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="spBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14161B"/>
      <stop offset="55%" stop-color="#101113"/>
      <stop offset="100%" stop-color="#0A0B0D"/>
    </linearGradient>
    <radialGradient id="spGlow" cx="74%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#101113" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#B49A78"/>
    </linearGradient>
    <linearGradient id="ballGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="spCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="55%" stop-color="#0F2C6E"/>
      <stop offset="100%" stop-color="#081329"/>
    </linearGradient>
    <linearGradient id="sp_pack_gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B2D12"/><stop offset="100%" stop-color="#1F1709"/>
    </linearGradient>
    <linearGradient id="sp_pack_amethyst" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E1A42"/><stop offset="100%" stop-color="#180E24"/>
    </linearGradient>
    <linearGradient id="sp_pack_diamond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#13294B"/><stop offset="100%" stop-color="#0B1930"/>
    </linearGradient>
    <filter id="spShadow" x="-18%" y="-10%" width="136%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#spBg)"/>
  <rect width="1280" height="640" fill="url(#spGlow)"/>

  <!-- Left Title Block (optimized for 320x160 thumbnail legibility) -->
  <g>
    <text x="72" y="130" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="16" font-weight="700" letter-spacing="3.2" fill="#B49A78">FULL-STACK BASKETBALL APP</text>

    <text x="72" y="218" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700" fill="#F1EDE5" letter-spacing="-1.2">Fantasy</text>
    <text x="72" y="296" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-style="italic" font-weight="400" fill="#B49A78">Basketball</text>

    <rect x="72" y="328" width="76" height="3.5" rx="1.75" fill="url(#spRule)"/>

    <text x="72" y="390" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="24.5" font-weight="400" fill="#D5D0C6">Collectible 3D player cards, PackMarket</text>
    <text x="72" y="426" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="24.5" font-weight="400" fill="#D5D0C6">openings, and club roster management.</text>

    <text x="72" y="492" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="17" font-weight="600" letter-spacing="0.5" fill="#8EA2A8">SwiftUI  ·  Django 5  ·  Django REST Framework</text>

    <line x1="72" y1="538" x2="620" y2="538" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="72" y="576" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15" font-weight="600" letter-spacing="1.4" fill="#8C96A3">ERTÜRK ERYAVUZ</text>
    <text x="620" y="576" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="16" font-weight="500" fill="#A6B0BC">Sample basketball data</text>
  </g>

  <!-- Right Tucked PackMarket Panel -->
  <g filter="url(#spShadow)">
    <rect x="1014" y="138" width="204" height="354" rx="22" fill="#141923" stroke="rgba(255,255,255,0.11)" stroke-width="1.2"/>
    <text x="1030" y="172" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#758D92">CARD PACKS</text>
    <text x="1030" y="198" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="19" font-weight="700" fill="#F1EDE5">PackMarket</text>

      <rect x="1028" y="224" width="174" height="68" rx="12" fill="url(#sp_pack_gold)" stroke="rgba(234,179,8,0.42)" stroke-width="1.2"/>
      <text x="1044" y="253" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="14.5" font-weight="700" fill="#F1EDE5">Gold Pack</text>
      <text x="1044" y="274" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12.5" font-weight="700" fill="#FACC15">500 Coins</text>
      <rect x="1028" y="306" width="174" height="68" rx="12" fill="url(#sp_pack_amethyst)" stroke="rgba(168,85,247,0.45)" stroke-width="1.2"/>
      <text x="1044" y="335" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="14.5" font-weight="700" fill="#F1EDE5">Amethyst Pack</text>
      <text x="1044" y="356" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12.5" font-weight="700" fill="#C084FC">800 Coins</text>
      <rect x="1028" y="388" width="174" height="68" rx="12" fill="url(#sp_pack_diamond)" stroke="rgba(56,189,248,0.48)" stroke-width="1.2"/>
      <text x="1044" y="417" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="14.5" font-weight="700" fill="#F1EDE5">Diamond Pack</text>
      <text x="1044" y="438" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12.5" font-weight="700" fill="#38BDF8">1,000 Coins</text>
  </g>

  <!-- Right Primary Collectible 3D Card -->
  <g filter="url(#spShadow)">
    <rect x="698" y="46" width="308" height="548" rx="32" fill="url(#spCard)" stroke="rgba(147,197,253,0.48)" stroke-width="2"/>
    <rect x="708" y="56" width="288" height="528" rx="26" fill="none" stroke="rgba(255,255,255,0.11)" stroke-width="1"/>

    <text x="734" y="136" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="64" font-weight="800" fill="#FFFFFF">97</text>
    <text x="736" y="162" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#93C5FD">OVR · GUARD</text>

    <circle cx="962" cy="112" r="22" fill="url(#ballGrad)" stroke="#1C1917" stroke-width="2"/>
    <path d="M 940 112 Q 962 108.04 984 112" fill="none" stroke="#1C1917" stroke-width="2.2"/>
    <path d="M 962 90 Q 965.96 112 962 134" fill="none" stroke="#1C1917" stroke-width="2.2"/>
    <path d="M 947.48 96.16 Q 958.48 112 947.48 127.84" fill="none" stroke="#1C1917" stroke-width="2"/>
    <path d="M 976.52 96.16 Q 965.52 112 976.52 127.84" fill="none" stroke="#1C1917" stroke-width="2"/>

    <polygon points="852,196 936,244 918,354 852,390 786,354 768,244" fill="rgba(8,19,41,0.68)" stroke="rgba(180,154,120,0.72)" stroke-width="2"/>

    <circle cx="852" cy="276" r="44" fill="url(#ballGrad)" stroke="#1C1917" stroke-width="2"/>
    <path d="M 808 276 Q 852 268.08 896 276" fill="none" stroke="#1C1917" stroke-width="2.2"/>
    <path d="M 852 232 Q 859.92 276 852 320" fill="none" stroke="#1C1917" stroke-width="2.2"/>
    <path d="M 822.96 244.32 Q 844.96 276 822.96 307.68" fill="none" stroke="#1C1917" stroke-width="2"/>
    <path d="M 881.04 244.32 Q 859.04 276 881.04 307.68" fill="none" stroke="#1C1917" stroke-width="2"/>
    <rect x="809" y="334" width="86" height="32" rx="8" fill="#0B1936" stroke="rgba(147,197,253,0.55)" stroke-width="1.2"/>
    <text x="852" y="356" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">#30</text>

    <rect x="752" y="418" width="200" height="32" rx="16" fill="rgba(147,197,253,0.16)" stroke="rgba(147,197,253,0.45)" stroke-width="1"/>
    <text x="852" y="439" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#E0F2FE">DARK BLUE DIAMOND</text>

    <text x="852" y="492" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">Player Card</text>
    <text x="852" y="522" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13.5" font-weight="600" letter-spacing="1.4" fill="#93C5FD">3D FLIP · 6 RARITIES</text>
  </g>
</svg>
